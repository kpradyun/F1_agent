name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastf1<4.0.0" langchain langchain-community langgraph
          pip install -r requirements.txt

      - name: Run unit tests (no network)
        run: |
          python -m pytest tests/test_race_analytics.py \
                           tests/test_gp_normalization.py \
                           tests/test_session_resolver.py \
                           -v --tb=short

      - name: Run error-handling tests
        run: |
          python -m pytest tests/test_tool_error_handling.py \
                           -v --tb=short
        continue-on-error: true
